<!DOCTYPE html>
<!-- The line above tells the browser this file is written in HTML5. -->

<!-- Opens the HTML document; lang="en" tells browsers and screen readers the page is in English. -->
<html lang="en">

<!-- Opens the head section, which holds information about the page that is not shown in the page body. -->
<head>
    <!-- Sets the character encoding to UTF-8 so all letters and symbols (like ©) display correctly. -->
    <meta charset="UTF-8">
    <!-- Makes the page scale correctly on phones and tablets by matching the device's screen width. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Sets the text shown in the browser tab. -->
    <title>My First Web Page</title>
    <!-- Opens a style block where CSS rules control how the page looks. -->
    <style>
        /* Styles the whole page body: font, background color, text color, and no default margin. */
        body { font-family: Arial, sans-serif; background-color: #f4f6f8; color: #222; margin: 0; }
        /* Styles the header: dark blue background, white text, padding inside, and centered text. */
        header { background-color: #1f4e79; color: #ffffff; padding: 20px; text-align: center; }
        /* Styles the main content area: limits its width, centers it, and adds space around it. */
        main { max-width: 600px; margin: 30px auto; padding: 20px; background-color: #ffffff; border-radius: 8px; }
        /* Styles the footer: gray background, centered small text, and padding. */
        footer { background-color: #dddddd; text-align: center; padding: 15px; font-size: 14px; }
    /* The tag below closes the style block. */
    </style>
<!-- Closes the head section. -->
</head>

<!-- Opens the body section, which holds everything visible on the page. -->
<body>

    <!-- Opens the header section at the top of the page. -->
    <header>
        <!-- The main heading (largest title) of the page. -->
        <h1>My First Web Page</h1>
    <!-- Closes the header section. -->
    </header>

    <!-- Opens the main section, which holds the page's primary content. -->
    <main>
        <!-- A second-level heading for the student information section. -->
        <h2>Student Information</h2>
        <!-- A paragraph showing my GitHub username; <strong> makes the label bold. -->
        <p><strong>Username:</strong> Pstadrous</p>
        <!-- A paragraph showing the course name. -->
        <p><strong>Course Name:</strong> Introduction to Web Development</p>
        <!-- A paragraph showing the course number. -->
        <p><strong>Course Number:</strong> IT 101</p>
        <!-- A paragraph showing the course section. -->
        <p><strong>Section:</strong> 001</p>
    <!-- Closes the main section. -->
    </main>

    <!-- Opens the footer section at the bottom of the page. -->
    <footer>
        <!-- A paragraph with the copyright symbol (&copy; displays ©), my name, and the due date. -->
        <p>&copy; Patrick Tadrous &ndash; Due Date: November 13, 2026</p>
    <!-- Closes the footer section. -->
    </footer>

<!-- Closes the body section. -->
</body>

<!-- Closes the HTML document. -->
</html>
